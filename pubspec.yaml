name: simple_player
description: SimplePlayer offers all the essential tools for viewing videos in your mobile applications in a simplified way!
version: 3.1.1
homepage: https://github.com/InaldoManso/Simple_Player
repository: https://github.com/InaldoManso/Simple_Player
issue_tracker: https://github.com/InaldoManso/Simple_Player/issues

topics:
  - video
  - player
  - video-player
  - media

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used by the widget tests to fake the native video player.
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.9.0

flutter:

  # For information on the generic Dart part of this file, see the
  # following page: https://dart.dev/tools/pub/pubspec
  #
  # dart pub publish --dry-run
